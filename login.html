<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Login | God's Grace Ultrasound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <form style="background: #ffffff; padding: 30px 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
    <h2 style="margin-bottom: 25px; color: #070b56; text-align: center;">Doctor Login</h2>

    <input type="email" placeholder="Email Address" required style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">
    
    <input type="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;">
    
    <button type="submit" style="background-color: #070b56; color: #ffffff; padding: 12px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
      Login
    </button>

    <p style="text-align: center; margin-top: 15px; font-size: 14px;">
      Forgot your password? <a href="#" style="color: #070b56;">Reset it</a>
    </p>
  </form>

</body>
</html>
