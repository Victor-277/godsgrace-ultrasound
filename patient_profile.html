<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile - Dr. God's Grace Ultrasound</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6fc;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .navbar-custom {
      background-color: #070b56;
      color: white;
      padding: 15px 30px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    main.container {
      max-width: 500px;
      margin: 100px auto 40px;
      background: white;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    h2 {
      color: #004085;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
    }
    label {
      font-weight: 600;
      color: #070b56;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2575fc, #6a11cb);
      border: none;
      font-weight: 600;
      width: 100%;
      padding: 10px;
      transition: background 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }
    @media (max-width: 576px) {
      main.container {
        margin: 120px 15px 40px;
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar-custom d-flex justify-content-between align-items-center px-3">
    <div class="d-flex align-items-center gap-2">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/stethoscope.png" width="32" alt="logo" />
      <strong>God's Grace Ultrasound</strong>
    </div>
    <div>Jane Doe</div>
  </nav>

  
  <main class="container">
    
    <h2>My Profile</h2>

    <form>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" value="Jane Doe" required />
      </div>

      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" id="dob" class="form-control" value="1990-05-12" required />
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" value="+234 8012345678" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" value="janedoe@example.com" />
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea id="address" class="form-control" rows="2" placeholder="Enter your address">123 Main Street, Lagos</textarea>
      </div>

      <button type="submit" class="btn btn-primary">Save Changes</button>
      
    </form>
    <a href="index.html" class="back-link">← Back to Dashboard</a>
  </main>
</body>
</html>
