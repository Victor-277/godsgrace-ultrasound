<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Patient - God's Grace Ultrasound</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
  />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="add_patient.css" />
</head>
<body>
  <nav class="navbar-custom d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <img
        src="https://img.icons8.com/ios-filled/50/ffffff/stethoscope.png"
        width="32"
        height="32"
        alt="stethoscope icon"
      />
      <strong>God's Grace Ultrasound</strong>
    </div>

    <div class="d-none d-md-block">
      <a href="profile.html" class="profile-link">Dr. God's Grace 👩‍⚕️</a>
    </div>

    <!-- Mobile menu toggle button -->
    <div class="d-block d-md-none">
      <button class="btn btn-light" id="menuToggle">☰</button>
    </div>
  </nav>

  <aside class="sidebar d-none d-md-flex">
      <a href="add_patient.html">➕ Add Patient</a>
      <a href="add_report.html">📋 Add Report</a>
      <a href="view_patients.html">🧍 Patients</a>
      <a href="view_reports.html">📑 Reports</a>
  </aside>

  <!-- Mobile menu -->
  <div class="mobile-menu d-md-none d-none" id="mobileMenu">
      <a href="add_patient.html">➕ Add Patient</a>
      <a href="add_report.html">📋 Add Report</a>
      <a href="view_patients.html">🧍 Patients</a>
      <a href="view_reports.html">📑 Reports</a>
  </div>

  <main class="content">
    <h2 class="page-title">Add New Patient</h2>

    <form class="patient-form">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter full name" required />
      </div>

      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" id="dob" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="+234 ..." required />
      </div>

      <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea id="notes" class="form-control" rows="4" placeholder="Additional information"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Add Patient</button>
    </form>
  </main>

  <script>
    // Toggle mobile menu
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    menuToggle?.addEventListener("click", () => {
      mobileMenu.classList.toggle("d-none");
    });
  </script>
</body>
</html>
