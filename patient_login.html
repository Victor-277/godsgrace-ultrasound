<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patient Login - Dr. God's Grace Ultrasound</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="text-center mb-4">
      <img src="https://img.icons8.com/ios-filled/50/000000/stethoscope.png" alt="logo" width="48" />
      <h1 class="mt-3" style="font-weight: 600; color: #004085;">Dr. God's Grace Ultrasound</h1>
      <p class="text-muted">Patient Portal Login</p>
    </div>

    <form style="width: 100%; max-width: 360px;">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
  </main>
</body>
</html>
