<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Appointment - God's Grace Ultrasound</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar-custom d-flex justify-content-between align-items-center px-3">
    <div class="d-flex align-items-center gap-2">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/stethoscope.png" width="32" alt="logo" />
      <strong>God's Grace Ultrasound</strong>
    </div>

    <div class="d-none d-md-block">
      <a href="patient_profile.html" class="profile-link">Jane Doe</a>
    </div>

    <div class="d-block d-md-none">
      <button class="btn btn-light" id="menuToggle">☰</button>
    </div>
  </nav>

  <aside class="sidebar d-none d-md-flex flex-column">
    <a href="patient_dashboard.html">🏠 Dashboard</a>
    <a href="patient_profile.html">👤 My Profile</a>
    <a href="my_appointments.html">📅 My Appointments</a>
    <a href="book_appointment.html">➕ Request Appointment</a>
    <a href="my_reports.html">📄 My Report</a>
  </aside>

  <div class="mobile-menu d-md-none d-none" id="mobileMenu">
    <a href="patient_dashboard.html">🏠 Dashboard</a>
    <a href="patient_profile.html">👤 My Profile</a>
    <a href="my_appointments.html">📅 My Appointments</a>
    <a href="book_appointment.html">➕ Request Appointment</a>
    <a href="my_reports.html">📄 My Report</a>
  </div>

  <main class="container mt-4 content">
    <h2 class="mb-4" style="color:#004085;">Request New Appointment</h2>

    <form class="report-form" style="max-width: 500px;">
      <div class="mb-3">
        <label for="appointmentDate" class="form-label">Select Date</label>
        <input type="date" id="appointmentDate" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="appointmentTime" class="form-label">Select Time</label>
        <input type="time" id="appointmentTime" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="appointmentType" class="form-label">Appointment Type</label>
        <select id="appointmentType" class="form-select" required>
          <option value="" disabled selected>Select type</option>
          <option>Routine Obstetric Scan</option>
          <option>Abdominal Scan</option>
          <option>Pelvic Scan</option>
          <option>Follow-up Consultation</option>
          <option>Other</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Book Appointment</button>
    </form>
  </main>

  <script>
    // Toggle mobile menu
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    menuToggle?.addEventListener("click", () => {
      mobileMenu.classList.toggle("d-none");
    });

    // Simple form submit handler (optional)
    document.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Appointment request submitted!');
      // Here you would add real submission logic
      e.target.reset();
    });
  </script>
</body>
</html>
